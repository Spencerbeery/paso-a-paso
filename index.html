  document.getElementById("combo").textContent=L.kind==="jump"?`${Math.max(0,L.maxMistakes-L.mistakes)} misses left`:L.combo>=3?L.combo+" in a row":"";

function footIdle(){const ex=L.queue[0];const f=document.getElementById("foot");f.className="foot";
  if(ex.type==="speak"){f.innerHTML=`<div class="foot-in"><button class="btn ghost" data-act="skipspeak">Can't speak now</button><button class="btn" data-act="spoke">I said it</button></div>`;return}

function evaluate(){
  const ex=L.queue[0],it=ex.item;let res;
  if(["intro","mcEsEn","mcEnEs","cloze"].includes(ex.type)){const ok=ex.opts[L.sel]===ex.answer;res={ok}}
  else if(["tilesEs","listenTiles","tilesEn"].includes(ex.type)){const txt=L.picked.map(i=>ex.tiles[i]).join(" ");const lang=ex.type==="tilesEn"?"en":"es";res=checkText(txt,lang==="en"?[it.en,...it.enAlts]:ex.type==="listenTiles"?[it.es]:[it.es,...it.esAlts],lang)}

function solution(ex){const it=ex.item;if(!it)return{a:"",b:""};if(ex.type==="tilesEn"||ex.type==="typeEn"||ex.type==="intro"||ex.type==="mcEsEn")return{a:it.en,b:it.es};return{a:it.es,b:it.en}}
const PRAISE=["Nice!","Correct!","Great!","¡Muy bien!","¡Eso es!","Exactly."];
function showResult(ok,note,overridable=true){
  const ex=L.queue[0];L.state="checked";

  if(ok){L.done++;L.combo++;L.maxCombo=Math.max(L.maxCombo,L.combo)}else{L.combo=0;L.mistakes++}
  document.querySelectorAll(".opt,.tile,textarea.ans,.accents button").forEach(b=>b.disabled=true);
  const s=solution(ex);const f=document.getElementById("foot");f.className="foot "+(ok?"ok":"bad");

function countIt(){const ex=L.queue[0];L.mistakes--;L.done++;L.combo=1;if(!ex.retry&&ex.item){L.firstOk++;const r=S.items[ex.item.id];if(r){r.h=Math.max(r.h,1.2)*1.6;r.c++}}L.lastOk=true;advance()}

  document.getElementById("path").innerHTML=h;
}
function weekChart(){const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return{k:dayKey(d),l:"SMTWTFS"[d.getDay()]}});const vals=days.map(d=>S.daily[d.k]||0);const W=280,H=120,top=16,bot=20,max=Math.max(S.goal,...vals,10);const bw=26,gap=(W-7*bw)/6;const y=v=>top+(H-top-bot)*(1-v/max);let g=`<line x1="0" x2="${W}" y1="${y(S.goal)}" y2="${y(S.goal)}" stroke="var(--accent-deep)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W}" y="${y(S.goal)-4}" text-anchor="end">goal ${S.goal}</text>`;days.forEach((d,i)=>{const x=i*(bw+gap),v=vals[i],yy=y(v);g+=`<rect x="${x}" y="${v?yy:H-bot-2}" width="${bw}" height="${v?H-bot-yy:2}" rx="5" fill="${i===6?"var(--accent)":"var(--s1)"}" opacity="${v?1:.35}"/><text x="${x+bw/2}" y="${H-5}" text-anchor="middle">${d.l}</text>${i===6&&v?`<text x="${x+bw/2}" y="${yy-4}" text-anchor="middle" style="fill:var(--ink)">${v}</text>`:""}`});return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="XP over the last 7 days">${g}</svg>`}
function renderRail(){
  const s=streakNow(),t=S.daily[dayKey()]||0,d=dueItems().length,sn=seen().length;const strong=seen().filter(it=>S.items[it.id].h>=7&&rec(it)>0.8).length;
  const wk=[...Array(7)].map((_,i)=>{const dd=new Date();dd.setDate(dd.getDate()-6+i);const k=dayKey(dd);return `<div>${"SMTWTFS"[dd.getDay()]}<i class="${S.daily[k]?"on":""} ${i===6?"today":""}"></i></div>`}).join("");
  document.getElementById("rail").innerHTML=`
  <div class="card"><div class="streak ${s?"":"off"}">${ic("flame")}<div><div class="big">${s}</div><div class="sub">day streak${s&&S.streak.last!==dayKey()?" · practice today to keep it":""}</div></div></div><div class="week">${wk}</div></div>
  <div class="card"><h3>Daily goal</h3><div class="bar"><i style="width:${Math.min(100,100*t/S.goal)}%"></i></div><p class="sub">${t>=S.goal?"Goal met for today. ¡Bien hecho!":`${S.goal-t} XP to go today`}</p>${weekChart()}</div>
  <div class="card"><h3>Review</h3><p class="sub">${!sn?"Phrases you learn show up here as they start to fade from memory.":d?`${d} phrase${d>1?"s are":" is"} fading. A short review now resets the clock.`:"Everything is fresh. You can still drill your weakest phrases."}</p><div><button class="btn small" data-act="global" ${sn?"":"disabled"}>${d?"Review now":"Practice weakest"}</button></div></div>
  <div class="card"><div class="stats3"><div><b>${S.xp}</b><span>Total XP</span></div><div><b>${sn}</b><span>Phrases seen</span></div><div><b>${strong}</b><span>Long-term</span></div></div></div>
  <div class="card"><h3>Settings</h3>
   <div class="setrow"><span class="lab">Daily goal</span><div class="seg">${[10,20,30,50].map(g=>`<button data-act="goal" data-g="${g}" aria-pressed="${S.goal===g}">${g} XP</button>`).join("")}</div></div>
   <div class="setrow"><span class="lab">Audio accent</span><div class="seg">${[["es-MX","Latin America"],["es-ES","Spain"]].map(([v,l])=>`<button data-act="dialect" data-v="${v}" aria-pressed="${S.settings.dialect===v}">${l}</button>`).join("")}</div>${HAS_TTS&&!canListen()?`<p class="sub">No Spanish voice found on this device, so listening exercises are swapped for reading ones.</p>`:""}</div>
   <label class="tog"><input type="checkbox" id="strict" data-act="strict" ${S.settings.strict?"checked":""}> Count missing accents as wrong</label>
   <div class="row"><button class="btn ghost small" data-act="reset">${resetArm?"Tap again to erase everything":"Reset progress"}</button></div>
   <p class="sync">${esc(syncMsg)}</p></div>
  <div class="card"><details class="method"><summary>How this course works</summary><ul>
   <li><b>Duolingo's skeleton.</b> Sections mapped to CEFR levels, units built around one real-world goal, and a single path where lessons, stories, practice and a unit review are interleaved.</li>
   <li><b>Spaced repetition.</b> Every phrase has a memory half-life, like Duolingo's half-life regression model. Get it right after a gap and the half-life grows; miss it and it shrinks. Review pulls whatever is fading.</li>
   <li><b>Adaptive difficulty.</b> Weak phrases come up as recognition (multiple choice, tiles). As they strengthen you're pushed to recall and produce them by typing and dictation, aiming for hard-but-doable.</li>
   <li><b>Comprehensible input.</b> Each unit has a story using its phrases in context, slightly above what you've drilled, with comprehension checks.</li>
   <li><b>Output and shadowing.</b> Typing Spanish from English forces production; "say it aloud" exercises train pronunciation and rhythm.</li>
   <li><b>Chunks over words.</b> You learn whole phrases you'd actually say, with grammar explained in each unit's guidebook when you need it.</li>
   <li><b>Errors come back.</b> Anything you miss returns later in the same lesson, and its memory strength drops so it reappears in review.</li></ul></details></div>`;
}
let resetArm=false;

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="node"){const n=NODES.find(x=>x.id===b.dataset.id);const idx=NODES.indexOf(n);if(idx>curIndex()){toast("Finish the earlier steps first, or use a jump test.");return}
    if(n.k==="tip")openGuide(n.u,n.id);else if(n.k==="story")startStory(n.u,n.id);else startSession(n.k,n.u,n.id);return}
  if(a==="guide"){openGuide(UNIT_BY_ID[+b.dataset.u],null);return}
  if(a==="gdone"){if(b.dataset.node){S.done[b.dataset.node]=true;save()}closeOv();return}
  if(a==="global"){startSession("global",null,null);return}
  if(a==="jump"){startSession("jump",{sec:+b.dataset.sec},null);return}
  if(a==="close"){closeOv();return}
  if(a==="quit"){closeOv();return}
  if(a==="say"||a==="sayslow"){speak(b.dataset.t,a==="sayslow");return}
  if(a==="goal"){S.goal=+b.dataset.g;save();renderHome();return}
  if(a==="dialect"){S.settings.dialect=b.dataset.v;save();renderRail();speak("Hola, ¿qué tal?");return}
  if(a==="strict"){S.settings.strict=b.checked;save();return}
  if(a==="reset"){if(!resetArm){resetArm=true;renderRail();setTimeout(()=>{resetArm=false;if(!L&&!P)renderRail()},4000);return}resetArm=false;S=DEFAULT();save();renderHome();toast("Progress erased.");return}
  if(a==="tr"){const t=b.querySelector(".tr");t.hidden=!t.hidden;return}
  if(a==="sq"){const k=+b.dataset.k,i=+b.dataset.i,q=P.ev[k].q;if(i===q.a){P.answered[k]=i;renderStory()}else{P.miss++;b.classList.remove("wrong");void b.offsetWidth;b.classList.add("wrong");b.disabled=true}return}
  if(a==="snext"){storyNext();return}
  if(!L)return;
  if(a==="peek"){document.getElementById("peekt").hidden=false;b.hidden=true;return}
  if(L.state!=="idle"){if(a==="cont")advance();else if(a==="countit")countIt();return}
  if(a==="opt"){L.sel=+b.dataset.i;document.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-pressed",o===b?"true":"false"));const bl=document.getElementById("blank");if(bl)bl.textContent=L.queue[0].opts[L.sel];if(L.queue[0].type==="mcEnEs")speak(L.queue[0].opts[L.sel]);setCheckable(true);return}
  if(a==="tile"){const i=+b.dataset.i;if(b.closest("#bank")){if(b.classList.contains("used"))return;b.classList.add("used");L.picked.push(i);const t=document.createElement("button");t.className="tile";t.dataset.act="tile";t.dataset.i=i;t.textContent=L.queue[0].tiles[i];document.getElementById("lane").appendChild(t)}else{L.picked=L.picked.filter(x=>x!==i);b.remove();document.querySelector(`#bank .tile[data-i="${i}"]`).classList.remove("used")}setCheckable(L.picked.length>0);return}
  if(a==="acc"){const t=document.getElementById("ans");const s=t.selectionStart,en=t.selectionEnd;t.value=t.value.slice(0,s)+b.dataset.c+t.value.slice(en);t.focus();t.selectionStart=t.selectionEnd=s+1;setCheckable(t.value.trim().length>0);return}
  if(a==="check"){evaluate();return}
  if(a==="skip"){showResult(false,null,false);return}
  if(a==="spoke"){showResult(true,null);return}
  if(a==="skipspeak"){L.queue.shift();L.total--;if(!L.queue.length)return finish(true);renderEx();return}
  if(a==="m"){const ex=L.queue[0];if(b.classList.contains("gone"))return;const side=b.dataset.side;if(side==="es")speak(b.textContent);
    if(!L.mSel||L.mSel.dataset.side===side){if(L.mSel)L.mSel.setAttribute("aria-pressed","false");L.mSel=b;b.setAttribute("aria-pressed","true");return}
    const A=L.mSel;L.mSel=null;A.setAttribute("aria-pressed","false");
    if(A.dataset.i===b.dataset.i){[A,b].forEach(x=>{x.classList.add("right");setTimeout(()=>{x.classList.remove("right");x.classList.add("gone");x.disabled=true},350)});L.mLeft--;if(L.mLeft===0)setTimeout(()=>{L.queue[0].item=null;showResult(true,"All pairs matched.")},400)}
    else{[A,b].forEach(x=>{x.classList.add("wrong");setTimeout(()=>x.classList.remove("wrong"),400)})}
    return}
});
document.addEventListener("input",e=>{if(e.target.id==="ans"&&L&&L.state==="idle")setCheckable(e.target.value.trim().length>0)});
document.addEventListener("keydown",e=>{
  if(!L&&!P&&e.key==="Enter"){const c=ov.querySelector("#cont");if(c){e.preventDefault();c.click()}return}
  if(P&&e.key==="Enter"){const c=document.getElementById("cont");if(c&&!c.disabled){e.preventDefault();c.click()}return}
  if(!L)return;
  if(e.key==="Enter"&&!e.shiftKey){if(L.state==="idle"){const c=document.getElementById("chk");if(c&&!c.disabled){e.preventDefault();c.click()}else if(e.target.id==="ans")e.preventDefault()}else{const c=document.getElementById("cont");if(c){e.preventDefault();c.click()}}return}
  if(L.state==="idle"&&e.target.tagName!=="TEXTAREA"&&/^[1-4]$/.test(e.key)){const o=document.querySelectorAll(".opt")[+e.key-1];if(o)o.click()}
});
renderHome();
setTimeout(initRemote,0);
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
